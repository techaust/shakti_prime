# Local Postgres for development and the security suite.
# The Supabase image carries the same extensions and roles as the hosted Mumbai projects.
services:
  postgres:
    image: supabase/postgres:17.6.1.177@sha256:8b1dc570b774b7a21ff15542ff783e285fd68c86fbf3e703a6a15e02f340bf60
    container_name: shakti-postgres
    ports:
      - '127.0.0.1:54322:5432'
    environment:
      POSTGRES_PASSWORD: postgres_local
    volumes:
      - shakti-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  shakti-postgres:
