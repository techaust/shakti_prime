packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

# Native binaries these packages install in their postinstall step (pnpm 12 blocks builds by default).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  # Its postinstall only prints a funding notice.
  tesseract.js: false
  unrs-resolver: true

# A version must be a day old before it is installed (AUDIT L22), so a compromised release that
# is pulled within hours never reaches the lockfile.
minimumReleaseAge: 1440

auditConfig:
  ignoreGhsas:
    # esbuild's development server (GHSA-67mh-4wv8-2f99) reaches us only through drizzle-kit,
    # a build tool linked from the workspace; it is never run as a server nor shipped (AUDIT M46).
    - GHSA-67mh-4wv8-2f99
    # braces (GHSA-vfj7-8cjw-p6xm, stack exhaustion on deeply nested patterns, no patched release
    # yet) reaches us only through eslint-config-next > @next/eslint-plugin-next > fast-glob >
    # micromatch, which expands the repository's own lint globs; it is never shipped nor fed
    # outside input. Remove this entry when a patched braces is released.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js (GHSA-hp3w-g68c-fv3c, unbounded precision specifiers, no patched release) reaches
    # us only through mammoth > argparse, which formats mammoth's own command-line help with fixed
    # format strings; the app never runs that command nor passes outside input to sprintf. Remove
    # this entry when a patched sprintf-js is released.
    - GHSA-hp3w-g68c-fv3c
    # minimatch (GHSA-g3hv-75wg-m249, pattern amplification with optimizationLevel 2 or more,
    # patched only in 11.0.1) reaches us through eslint, typescript-eslint, glob and archiver's
    # readdir-glob, all on 3.x, 5.x or 10.x; they match the repository's own lint and build globs
    # at the default level, never a pattern from outside. Remove this entry when they move to 11.
    - GHSA-g3hv-75wg-m249
    # glob (GHSA-3g3m-2fjr-6pw4, an aborted walk keeps reading directories, patched only in
    # 14.0.2) reaches us through @sentry/bundler-plugins, which globs the build's own output for
    # source maps without an AbortSignal, and archiver-utils on 7.x, which nothing calls. Remove
    # this entry when @sentry/bundler-plugins moves to glob 14.
    - GHSA-3g3m-2fjr-6pw4

overrides:
  # exceljs pins uuid 8, below the fix for GHSA-w5hq-g745-h8pq; 11.x keeps the CommonJS build
  # exceljs requires, and exceljs calls only v4.
  'exceljs>uuid': ^11.1.1
  # source-map-js before 1.2.2 (GHSA-68fv-2mgg-jv7q) reaches us through postcss, vite and
  # magicast; 1.2.2 is the patch release of the same API.
  source-map-js: ^1.2.2
