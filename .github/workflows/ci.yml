name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    name: Lint, format and copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shakti/tokens build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm copy-lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  security:
    name: Security suite (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.177
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user_ci@localhost:5432/postgres
      DATABASE_URL_MIGRATOR: postgres://postgres:postgres_ci@localhost:5432/postgres
      APP_USER_PASSWORD: app_user_ci
      DATABASE_URL_AUTH: postgres://auth_service:auth_service_ci@localhost:5432/postgres
      AUTH_SERVICE_PASSWORD: auth_service_ci
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test:security
