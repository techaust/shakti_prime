name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the merge-on-green workflow, whose commits trigger no run: on main after a merge, and
  # on a pull request's branch after it took main into it (a run that decides the merge again).
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded runs; every push to main keeps its own run and verdict.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Decides which jobs a run needs, so a pull request that changes only documents spends minutes
  # on the cheap checks alone (GitHub's included Actions minutes are limited per month).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A pull request's branch, started by hand or by the merge workflow, is compared with main.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            BASE=origin/main
            HEAD=HEAD
          elif [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Without rename detection, a file moved into docs/ is listed under its old path too.
          files=$(git diff --name-only --no-renames "$BASE...$HEAD")
          echo "$files"
          # Documents only: docs/ (the generated ERD and machine specs are checked by the unit
          # tests, which always run) and the Markdown files at the root.
          if echo "$files" | grep -qvE '^(docs/.*|[^/]+\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint, format and copy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm copy-lint
      # Generated files are committed as generated (AUDIT M47): the design-token CSS, the app
      # icon in the accent colour and the migrations must match their sources, or a stale file
      # ships.
      - name: Generated files are up to date
        run: |
          pnpm --filter @shakti/tokens build
          pnpm db:generate
          git status --porcelain -- packages/tokens/src apps/web/src/app/icon.svg packages/db/migrations
          git diff --exit-code -- packages/tokens/src apps/web/src/app/icon.svg packages/db/migrations
          test -z "$(git status --porcelain -- packages/tokens/src apps/web/src/app/icon.svg packages/db/migrations)"

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The English OCR model the real masking tests read (audit OPS-5), so a bump of tesseract.js
      # or PDFium that stops the masking from finding digits fails here: taken once from the npm
      # registry (npm checks the package's integrity) and kept in the Actions cache, keyed by the
      # installed tesseract.js and the model package's version.
      - name: Which OCR engine is installed
        id: ocr
        run: echo "version=$(node -p "require('./apps/web/node_modules/tesseract.js/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: OCR model from the cache
        id: ocr-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/ocr-model
          key: ocr-eng-best-int-1.0.0-tesseract.js-${{ steps.ocr.outputs.version }}
      - name: OCR model from the npm registry
        if: steps.ocr-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          npm pack @tesseract.js-data/eng@1.0.0
          mkdir -p ocr-model
          tar -xzf tesseract.js-data-eng-1.0.0.tgz -C ocr-model --strip-components=2 package/4.0.0_best_int/eng.traineddata.gz
      # The model's own bytes, checked whether they came from the cache or the registry.
      - name: OCR model is the one pinned
        working-directory: ${{ runner.temp }}/ocr-model
        run: echo "45b4cb346724ac1774f1c36f42f182b887bcdb28ebe63e6fff90ac41f3fcff91  eng.traineddata.gz" | sha256sum -c -
      - run: pnpm test
        env:
          OCR_LANG_PATH: ${{ runner.temp }}/ocr-model

  build:
    name: Production build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # First-load JavaScript of every page against apps/web/js-budget.json (BLUEPRINT §11.4).
      - name: JavaScript budget per page
        run: pnpm --filter web js-budget

  supply-chain:
    name: Secrets and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan over the history
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --no-banner --redact --exit-code 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Moderate and above; reviewed exceptions are listed with their reason in pnpm-workspace.yaml.
      - run: pnpm audit --audit-level=moderate

  security:
    name: Security suite (real Postgres)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: supabase/postgres:17.6.1.177@sha256:8b1dc570b774b7a21ff15542ff783e285fd68c86fbf3e703a6a15e02f340bf60
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user_ci@localhost:5432/postgres
      DATABASE_URL_MIGRATOR: postgres://postgres:postgres_ci@localhost:5432/postgres
      APP_USER_PASSWORD: app_user_ci
      DATABASE_URL_AUTH: postgres://auth_service:auth_service_ci@localhost:5432/postgres
      AUTH_SERVICE_PASSWORD: auth_service_ci
      DATABASE_URL_OUTBOX: postgres://outbox_publisher:outbox_publisher_ci@localhost:5432/postgres
      OUTBOX_PUBLISHER_PASSWORD: outbox_publisher_ci
      DATABASE_URL_READER: postgres://app_reader:app_reader_ci@localhost:5432/postgres
      APP_READER_PASSWORD: app_reader_ci
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The English OCR model the real masking tests read (audit OPS-5), so a bump of tesseract.js
      # or PDFium that stops the masking from finding digits fails here: taken once from the npm
      # registry (npm checks the package's integrity) and kept in the Actions cache, keyed by the
      # installed tesseract.js and the model package's version.
      - name: Which OCR engine is installed
        id: ocr
        run: echo "version=$(node -p "require('./apps/web/node_modules/tesseract.js/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: OCR model from the cache
        id: ocr-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/ocr-model
          key: ocr-eng-best-int-1.0.0-tesseract.js-${{ steps.ocr.outputs.version }}
      - name: OCR model from the npm registry
        if: steps.ocr-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          npm pack @tesseract.js-data/eng@1.0.0
          mkdir -p ocr-model
          tar -xzf tesseract.js-data-eng-1.0.0.tgz -C ocr-model --strip-components=2 package/4.0.0_best_int/eng.traineddata.gz
      # The model's own bytes, checked whether they came from the cache or the registry.
      - name: OCR model is the one pinned
        working-directory: ${{ runner.temp }}/ocr-model
        run: echo "45b4cb346724ac1774f1c36f42f182b887bcdb28ebe63e6fff90ac41f3fcff91  eng.traineddata.gz" | sha256sum -c -
      - run: pnpm test:security
        env:
          OCR_LANG_PATH: ${{ runner.temp }}/ocr-model
      # Every migration on disk is applied as it is (AUDIT M22).
      - run: pnpm db:verify

  e2e:
    name: End-to-end (${{ matrix.project }})
    needs: changes
    # Pull requests and their branches; the run on main after a merge repeats the tree its pull
    # request passed, since that pull request merges only on the main it was tested with.
    if: github.ref != 'refs/heads/main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One job per project, each with its own database; the sign-in setup runs in each. The image
    # is the one the screenshot baselines are made in (pnpm --filter web e2e:snap), so fonts and
    # anti-aliasing match, and its browsers match @playwright/test.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-light, desktop-dark, phone]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    services:
      postgres:
        image: supabase/postgres:17.6.1.177@sha256:8b1dc570b774b7a21ff15542ff783e285fd68c86fbf3e703a6a15e02f340bf60
        env:
          POSTGRES_PASSWORD: postgres_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The service answers by its name on the job's network; the step "Reach the database" below
      # forwards it to localhost, where the seed and the app use it as a local database, without
      # TLS (a database under any other name needs DATABASE_CA_CERT, packages/db/src/connection.ts).
      DATABASE_URL: postgres://app_user:app_user_ci@localhost:5432/postgres
      DATABASE_URL_MIGRATOR: postgres://postgres:postgres_ci@localhost:5432/postgres
      APP_USER_PASSWORD: app_user_ci
      DATABASE_URL_AUTH: postgres://auth_service:auth_service_ci@localhost:5432/postgres
      AUTH_SERVICE_PASSWORD: auth_service_ci
      DATABASE_URL_OUTBOX: postgres://outbox_publisher:outbox_publisher_ci@localhost:5432/postgres
      OUTBOX_PUBLISHER_PASSWORD: outbox_publisher_ci
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      # The server is started by the step below; Playwright only drives the browser.
      E2E_EXTERNAL_APP: '1'
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    # Each step runs its package script directly, not through Turbo, so its output streams as it
    # happens, and each has its own limit, so a hang fails at the step that hung.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Build
        run: pnpm exec turbo run build --filter=web --log-order=stream --output-logs=full
        timeout-minutes: 8
      - name: Reach the database as localhost
        working-directory: apps/web
        run: nohup node e2e/setup/forward.mjs 5432 postgres > /dev/null 2>&1 &
        timeout-minutes: 1
      - name: Migrate and seed
        run: pnpm --filter web e2e:seed
        timeout-minutes: 5
      # The production build as a local production run (apps/web/src/auth/deps.ts), with the
      # stand-in AI transport, as playwright.config.ts's own server has.
      - name: Start the app
        working-directory: apps/web
        run: |
          BOS_ENVIRONMENT=local AI_TRANSPORT=fake nohup pnpm exec next start -p 3000 > next.log 2>&1 &
          node e2e/setup/wait-for-app.mjs http://localhost:3000/api/v1/health 90 next.log
        timeout-minutes: 3
      - name: Journeys, axe and screenshots (${{ matrix.project }})
        working-directory: apps/web
        run: pnpm exec playwright test --project=${{ matrix.project }}
        timeout-minutes: 21
      - name: The app's log
        if: failure()
        working-directory: apps/web
        run: tail -n 200 next.log || true
      - name: Keep the report and the screenshot differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.project }}
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
          retention-days: 14

  lighthouse:
    name: Lighthouse
    needs: changes
    if: github.ref != 'refs/heads/main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: supabase/postgres:17.6.1.177@sha256:8b1dc570b774b7a21ff15542ff783e285fd68c86fbf3e703a6a15e02f340bf60
        env:
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user_ci@localhost:5432/postgres
      DATABASE_URL_MIGRATOR: postgres://postgres:postgres_ci@localhost:5432/postgres
      APP_USER_PASSWORD: app_user_ci
      DATABASE_URL_AUTH: postgres://auth_service:auth_service_ci@localhost:5432/postgres
      AUTH_SERVICE_PASSWORD: auth_service_ci
      DATABASE_URL_OUTBOX: postgres://outbox_publisher:outbox_publisher_ci@localhost:5432/postgres
      OUTBOX_PUBLISHER_PASSWORD: outbox_publisher_ci
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      # The production build as a local production run (apps/web/src/auth/deps.ts).
      - name: Start the app
        working-directory: apps/web
        run: |
          BOS_ENVIRONMENT=local nohup pnpm exec next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/v1/health > /dev/null && exit 0
            sleep 2
          done
          cat next.log
          exit 1
      # Public pages only: a signed-in page would need a session cookie in the Lighthouse
      # settings, and the uploaded results would carry it.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/sign-in
          configPath: apps/web/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
