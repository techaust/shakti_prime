name: Merge on green

# The free plan cannot require a green CI run before a merge (AUDIT M45), so this workflow is the
# only one that merges: after CI passes on a pull request, it merges that pull request into main if
# the rule below says so, deletes its branch and runs CI again on main. It checks out no code and
# runs nothing from the pull request; every value it reads reaches the shell through `env` or a
# jq argument. GitHub runs this file from main only, so a change to it takes effect after it merges.
#
# A pull request merges only onto the main it was tested with (docs/09-testing.md §6): when main
# has moved since, its branch takes main by a merge commit and CI runs again on it. A commit made
# with this workflow's token starts no `pull_request` run, so that run is started here by hand
# (`workflow_dispatch` on the branch), and its success brings the pull request back here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # A pull request left open by a dropped pending run, or labelled `checks-ok` after its run, is
  # looked at again four times a day; each look is one short job (GitHub's Actions minutes are
  # limited per month).
  schedule:
    - cron: '23 1,5,9,13 * * *'
  # The owner looks at one pull request again at once, for example right after adding `checks-ok`
  # (`gh workflow run automerge.yml -f pull_request=<number>`); with no number, every open one.
  workflow_dispatch:
    inputs:
      pull_request:
        description: Number of the pull request to look at again (every open one when empty)
        type: string
        required: false

permissions: {}

jobs:
  merge:
    name: Merge a green pull request
    # A CI run counts when it passed on a branch of this repository other than main, started by a
    # pull request or by this workflow after it took main into the branch.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch != 'main' &&
        (github.event.workflow_run.event == 'pull_request' ||
         github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On the job, not the workflow, so only runs that decide something wait their turn: every CI
    # completion starts this workflow, and a run whose job is skipped no longer queues (a newer
    # pending run cancels an older pending one). The schedule picks up a decision dropped all the same.
    concurrency:
      group: merge-on-green
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      ONE_PULL_REQUEST: ${{ inputs.pull_request }}
      # Judges one pull request against the commit CI passed on and answers `merge`, `update`
      # (main moved: take it into the branch and test again) or `skip: <why>`.
      # $pr: the pull request; $files: every path it adds, changes, removes or renames, from and to;
      # $tested: the commit CI passed on; $behind: the commits of main that commit does not hold.
      # Only the owner's pull requests and Dependabot's minor and patch bumps merge; a Dependabot
      # group is minor and patch by .github/dependabot.yml, a single bump needs the same major. A
      # pull request that changes the checks themselves (.github/, turbo.json, a vitest or
      # Playwright config) waits for the owner's `checks-ok` label (owner, 13-10-2026).
      MERGE_RULE: |
        def major: ltrimstr("v") | split(".")[0];
        def same_major:
          [.title | capture("from v?(?<a>[0-9][^ ]*) to v?(?<b>[0-9][^ ]*)") | (.a | major) == (.b | major)]
          | any;
        def checks_path:
          test("^\\.github/")
          or . == "turbo.json"
          or test("(^|/)(vitest|playwright)(\\.[^/]+)?\\.config\\.[cm]?[jt]s$");
        def labelled($name): any($pr.labels[]; .name == $name);
        ([$files[] | .filename, (.previous_filename // empty)] | map(select(checks_path)) | unique) as $checks
        | if $pr.state != "OPEN" then "skip: not open"
          elif $pr.isDraft then "skip: draft"
          elif $pr.baseRefName != "main" then "skip: base is \($pr.baseRefName), not main"
          elif $pr.isCrossRepository then "skip: from a fork"
          elif labelled("hold") then "skip: labelled hold"
          elif $pr.headRefOid != $tested then "skip: a newer commit than the one tested"
          elif $pr.author.login != "techaust" and $pr.author.login != "app/dependabot" then
            "skip: author \($pr.author.login)"
          elif $pr.author.login == "app/dependabot"
            and ($pr.title | test("bump the .+ group"; "i") | not)
            and ($pr | same_major | not) then
            "skip: a major version bump waits for the owner"
          elif ($files | length) < $pr.changedFiles and (labelled("checks-ok") | not) then
            "skip: more files than GitHub lists, so the checks may be among them; waits for the owner's checks-ok label"
          elif ($checks | length) > 0 and (labelled("checks-ok") | not) then
            "skip: changes the checks (\($checks | join(", "))); waits for the owner's checks-ok label"
          elif $behind > 0 then "update"
          else "merge"
          end
    steps:
      - name: Decide, then merge or test again
        run: |
          set -euo pipefail
          main_sha() { gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha; }
          main=$(main_sha)
          status=0

          # The commit the latest CI run of a pull request passed on: its head when that run
          # succeeded (started by the pull request or by this workflow), or nothing.
          passed_head() {
            gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=$1&per_page=20" --jq \
              '[.workflow_runs[] | select(.event == "pull_request" or .event == "workflow_dispatch")]
               | first // {} | if .status == "completed" and .conclusion == "success" then .head_sha else "" end'
          }

          judge() {
            local number=$1 tested=$2 pr files behind decision branch head
            pr=$(gh pr view "$number" --json number,state,isDraft,baseRefName,isCrossRepository,labels,headRefOid,headRefName,author,title,changedFiles)
            files=$(gh api --paginate "repos/${GH_REPO}/pulls/${number}/files?per_page=100" \
              --jq '[.[] | {filename, previous_filename}]' | jq -s 'add // []')
            behind=$(gh api "repos/${GH_REPO}/compare/${main}...${tested}" --jq .behind_by)
            decision=$(jq -n -r --argjson pr "$pr" --argjson files "$files" --arg tested "$tested" \
              --argjson behind "$behind" "$MERGE_RULE")
            branch=$(jq -r .headRefName <<< "$pr")
            echo "Pull request ${number} on ${branch} at ${tested}: ${decision}" | tee -a "$GITHUB_STEP_SUMMARY"
            case "$decision" in
              merge)
                gh pr merge "$number" --merge --match-head-commit "$tested"
                gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
                # A merge made with this workflow's token starts no push run, so CI is started on main here.
                gh workflow run ci.yml --ref main
                echo "Merged, deleted ${branch} and started CI on main." | tee -a "$GITHUB_STEP_SUMMARY"
                main=$(main_sha)
                ;;
              update)
                # GitHub merges main into the branch in the background; the expected head stops it
                # when someone pushed in the meantime. A conflict is left to a person.
                if ! gh api -X PUT "repos/${GH_REPO}/pulls/${number}/update-branch" \
                  -f expected_head_sha="$tested" > /dev/null; then
                  echo "Pull request ${number}: main moved and could not be taken into ${branch}; take main into it by hand." | tee -a "$GITHUB_STEP_SUMMARY"
                  status=1
                  return
                fi
                head=$tested
                for _ in $(seq 1 30); do
                  head=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
                  [ "$head" != "$tested" ] && break
                  sleep 2
                done
                if [ "$head" = "$tested" ]; then
                  echo "Pull request ${number}: ${branch} did not take main within a minute; the next look tries again." | tee -a "$GITHUB_STEP_SUMMARY"
                  status=1
                  return
                fi
                gh workflow run ci.yml --ref "$branch"
                echo "Took main into ${branch} (now ${head}) and started CI on it; its success brings it back here." | tee -a "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          }

          if [ "$EVENT" = workflow_run ]; then
            # The open pull requests of this repository from the tested branch (a fork's pull
            # request with the same branch name is not one of them).
            numbers=$(gh pr list --head "$HEAD_BRANCH" --state open --json number,isCrossRepository \
              --jq '.[] | select(.isCrossRepository | not) | .number')
            if [ -z "$numbers" ]; then
              echo "No open pull request from ${HEAD_BRANCH} at ${HEAD_SHA}." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            for number in $numbers; do judge "$number" "$HEAD_SHA"; done
          else
            if [ -n "$ONE_PULL_REQUEST" ]; then
              if ! [[ "$ONE_PULL_REQUEST" =~ ^[0-9]+$ ]]; then
                echo "Name the pull request by its number, such as 172."
                exit 1
              fi
              numbers=$ONE_PULL_REQUEST
            else
              numbers=$(gh pr list --state open --base main --json number,isCrossRepository,isDraft \
                --jq '.[] | select((.isCrossRepository or .isDraft) | not) | .number')
            fi
            for number in $numbers; do
              head=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
              tested=$(passed_head "$head")
              if [ -z "$tested" ]; then
                echo "Pull request ${number} at ${head}: skip: its latest CI run has not passed" | tee -a "$GITHUB_STEP_SUMMARY"
                continue
              fi
              judge "$number" "$tested"
            done
          fi
          exit "$status"
