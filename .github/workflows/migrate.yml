name: Migrate a hosted database

# Applies the migrations to staging or production from a reviewed commit on main, then checks
# every migration is applied as it is on disk (docs/runbooks/DEPLOY.md, AUDIT L24). The database
# credentials and CA certificate are secrets of the GitHub environment; nothing runs until they
# are set, and production can require a reviewer in the environment's protection rules.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    concurrency:
      group: migrate-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DATABASE_URL_MIGRATOR: ${{ secrets.DATABASE_URL_MIGRATOR }}
      APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
      AUTH_SERVICE_PASSWORD: ${{ secrets.AUTH_SERVICE_PASSWORD }}
      OUTBOX_PUBLISHER_PASSWORD: ${{ secrets.OUTBOX_PUBLISHER_PASSWORD }}
      DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Run this from main, so only reviewed migrations reach a hosted database.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:verify
