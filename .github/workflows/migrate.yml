name: Migrate a hosted database

# Applies the migrations to a hosted database from a reviewed commit on main, then checks every
# migration is applied as it is on disk (docs/runbooks/deploy.md §2; docs/14-reviews/2026-09-audit.md
# L24). The steps are the action `.github/actions/migrate-database`, which the release workflow
# runs for production too.
#
# Dev and staging read repository secrets named with their suffix (`_DEV`, `_STAGING`). Production
# runs in the GitHub environment `production` (docs/14-reviews/2026-09-audit.md M45), which holds its
# own six secrets without a suffix. The environment's settings on GitHub are the gate
# (docs/runbooks/deploy.md §1): its required reviewer makes the run wait for the owner's approval,
# and its one deployment branch rule, `main`, is what keeps every other ref out, since a branch's
# copy of this file could drop the guard below. A release (`release.yml`) migrates production on its
# own, after checking CI and that staging ran the same migrations first. This workflow's production
# choice is for work between releases, such as a password rotation (docs/runbooks/deploy.md §5):
# it checks out the commit the newest release tagged, the code production runs, so it applies no
# migration a release has not checked, never main's head.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which database
        type: choice
        options: [dev, staging, production]
        required: true
      seed:
        description: Seed the reference data after migrating (safe to re-run; keeps Admin edits)
        type: boolean
        default: true
      rotate_passwords:
        description: Set the login roles' passwords again from this environment's secrets (after a rotation)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Stops a run from any other ref with a plain message before production asks for the owner's
  # approval. For production the environment's branch rule is the check that holds.
  guard:
    name: Only from main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != 'refs/heads/main' ]; then
            echo 'Run this from main, so only reviewed migrations reach a hosted database.'
            exit 1
          fi

  migrate:
    name: Migrate ${{ inputs.environment }}
    needs: guard
    if: inputs.environment == 'dev' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: migrate-${{ inputs.environment }}
      cancel-in-progress: false
    # Secret names are case-insensitive, so `_dev` reads `DATABASE_URL_MIGRATOR_DEV`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/migrate-database
        with:
          environment: ${{ inputs.environment }}
          # The Supabase project each choice must reach; a secret pasted under the wrong suffix stops here.
          project-ref: ${{ inputs.environment == 'dev' && 'pgjwtygifnwxdkzdjsup' || 'azydxxvlboivablvvojp' }}
          secret-suffix: ${{ inputs.environment == 'dev' && '_DEV' || '_STAGING' }}
          database-url-migrator: ${{ secrets[format('DATABASE_URL_MIGRATOR_{0}', inputs.environment)] }}
          app-user-password: ${{ secrets[format('APP_USER_PASSWORD_{0}', inputs.environment)] }}
          auth-service-password: ${{ secrets[format('AUTH_SERVICE_PASSWORD_{0}', inputs.environment)] }}
          outbox-publisher-password: ${{ secrets[format('OUTBOX_PUBLISHER_PASSWORD_{0}', inputs.environment)] }}
          database-ca-cert: ${{ secrets[format('DATABASE_CA_CERT_{0}', inputs.environment)] }}
          app-reader-password: ${{ secrets[format('APP_READER_PASSWORD_{0}', inputs.environment)] }}
          seed: ${{ inputs.seed }}
          rotate-passwords: ${{ inputs.rotate_passwords }}

  migrate-production:
    name: Migrate production
    needs: guard
    if: inputs.environment == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The owner approves the run (the environment's required reviewer), the environment's branch
    # rule admits main alone, and the environment's own secrets reach this job alone.
    environment: production
    # One production change at a time: the release workflow uses the same group.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      # The newest `release-<n>` tag (by number) names what production runs; it must be on main.
      - name: The commit production was released at
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          newest=$(gh api "repos/$REPO/git/matching-refs/tags/release-" --paginate --jq '.[] | .ref + " " + .object.sha' |
            sed -n 's|^refs/tags/release-\([0-9][0-9]*\) \([0-9a-f]\{40\}\)$|\1 \2|p' | sort -n | tail -n 1)
          if [ -z "$newest" ]; then
            echo 'Production has had no release yet. The first release migrates it (docs/runbooks/deploy.md §2).'
            exit 1
          fi
          tag="release-${newest%% *}"
          sha="${newest#* }"
          status=$(gh api "repos/$REPO/compare/$sha...main" --jq .status)
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "The newest release, $tag, names $sha, which is not a commit of main."
            exit 1
          fi
          echo "Production runs $sha ($tag); this run migrates to it and no further."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.released.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/migrate-database
        with:
          environment: production
          project-ref: ifnoytyhnedgiyhxxhhu
          database-url-migrator: ${{ secrets.DATABASE_URL_MIGRATOR }}
          app-user-password: ${{ secrets.APP_USER_PASSWORD }}
          auth-service-password: ${{ secrets.AUTH_SERVICE_PASSWORD }}
          outbox-publisher-password: ${{ secrets.OUTBOX_PUBLISHER_PASSWORD }}
          database-ca-cert: ${{ secrets.DATABASE_CA_CERT }}
          app-reader-password: ${{ secrets.APP_READER_PASSWORD }}
          seed: ${{ inputs.seed }}
          rotate-passwords: ${{ inputs.rotate_passwords }}
