# Dependency updates (docs/07-security.md §8, supply chain). Grouped weekly so the lockfile moves in one PR, which the
# merge-on-green workflow merges once CI passes. Majors come one at a time, outside the groups
# (AUDIT L25), and wait for the owner's review: a TypeScript or ESLint major waits until
# typescript-eslint and the Next.js config support it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      # The test runner and its browser core move together: `@playwright/test` (development) and
      # `playwright-core` (production) at different versions give two `Page` types and fail the
      # typecheck. A dependency joins the first group it matches, so this one comes first.
      playwright:
        patterns: ['@playwright/test', 'playwright-core', 'playwright']
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
