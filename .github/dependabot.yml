# Dependency updates (docs/07-security.md §8, supply chain). Grouped weekly so the lockfile moves in one PR, which the
# merge-on-green workflow merges once CI passes. Majors come one at a time, outside the groups
# (AUDIT L25), and wait for the owner's review: a TypeScript or ESLint major waits until
# typescript-eslint and the Next.js config support it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Playwright moves only by hand: `@playwright/test` and `playwright-core` together, with the
      # Playwright image (its tag and digest) in .github/workflows/ci.yml and
      # apps/web/e2e/setup/snap-in-linux.ts and the screenshot baselines remade. No ecosystem here
      # reads the workflows' container images: they and the Postgres image move by hand, pinned by
      # digest (apps/web/src/ci-images.test.ts keeps every copy the same). A bump of one package alone fails the typecheck (two `Page`
      # types), and a bump of both still runs in the old image.
      - dependency-name: '@playwright/test'
      - dependency-name: playwright-core
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kolkata
