<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shakti Prime prototype</title>
    <meta name="theme-color" content="#FFFFFF" />
    <style>
      /* Tokens copied from packages/tokens/src/tokens.css (DESIGN.md §2). */
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #f6f6f8;
        --surface-3: #edecef;
        --text: #1d1d21;
        --text-muted: #626163;
        --text-subtle: #818183;
        --border: #e4e4e6;
        --border-strong: #908f92;
        --accent: #5e6ad2;
        --accent-hover: #4c5bc1;
        --accent-text: #5a66ce;
        --accent-fg: #ffffff;
        --accent-soft: #f1efff;
        --focus: #5e6ad2;
        --success: #15803d;
        --success-soft: #dcfce7;
        --warning: #b45309;
        --warning-soft: #fef3c7;
        --danger: #b91c1c;
        --danger-soft: #fee2e2;
        --info: #0369a1;
        --info-soft: #e0f2fe;
        --rose: #be185d;
        --shadow-1: 0 1px 2px rgb(0 0 0 / 0.06), 0 4px 12px rgb(0 0 0 / 0.08);
        --shadow-2: 0 8px 24px rgb(0 0 0 / 0.12);
        --scrim: rgb(0 0 0 / 0.32);
        color-scheme: light;
        --stage-new: var(--text-subtle);
        --stage-contacted: var(--warning);
        --stage-qualified: var(--accent);
        --stage-quoted: var(--info);
        --stage-won: var(--success);
        --stage-lost: var(--danger);
        --entity-1: var(--accent);
        --entity-2: var(--info);
        --entity-3: var(--success);
        --entity-4: var(--rose);
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --radius-xl: 12px;
        --control: 36px;
        --row: 40px;
        --row-compact: 32px;
        --font: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      :root[data-theme='dark'] {
        --bg: #08090a;
        --surface: #111014;
        --surface-2: #18171b;
        --surface-3: #1e1e21;
        --text: #f8f8fa;
        --text-muted: #929196;
        --text-subtle: #707074;
        --border: #262529;
        --border-strong: #646468;
        --accent-text: #6e78e1;
        --accent-soft: #2e2e48;
        --success: #4ade80;
        --success-soft: #0f2e1a;
        --warning: #fbbf24;
        --warning-soft: #3a2a08;
        --danger: #f87171;
        --danger-soft: #3b1111;
        --info: #38bdf8;
        --info-soft: #0c2a3d;
        --rose: #f472b6;
        --shadow-1: 0 1px 2px rgb(0 0 0 / 0.4);
        --shadow-2: 0 8px 24px rgb(0 0 0 / 0.5);
        --scrim: rgb(0 0 0 / 0.6);
        color-scheme: dark;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 20px;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
      h2 { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
      h3 { font-size: 16px; line-height: 24px; font-weight: 600; }
      a { color: var(--accent-text); }
      button, input, select, textarea { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .muted { color: var(--text-muted); }
      .subtle { color: var(--text-subtle); }
      .caption { font-size: 12px; line-height: 16px; }
      .num { font-variant-numeric: tabular-nums; font-weight: 500; }
      .right { text-align: right; }
      .hidden { display: none !important; }
      .stack > * + * { margin-top: 16px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .spread { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
      .grow { flex: 1 1 auto; min-width: 0; }
      svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

      /* Buttons and fields (DESIGN.md §6) */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        height: var(--control); padding: 0 12px; border-radius: var(--radius-md);
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
        font-weight: 500; cursor: pointer; white-space: nowrap;
        transition: background-color 120ms ease-out, border-color 120ms ease-out;
      }
      .btn:hover { background: var(--surface-3); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
      .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      .btn.ghost { border-color: transparent; background: transparent; }
      .btn.ghost:hover { background: var(--surface-3); }
      .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
      :root[data-theme='dark'] .btn.danger { color: #111014; }
      .btn.icon { width: var(--control); padding: 0; }
      .btn.sm { height: 28px; padding: 0 8px; font-size: 13px; }
      .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
      .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
      .field label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-muted); }
      .input, select.input, textarea.input {
        height: var(--control); width: 100%; padding: 0 10px; border-radius: var(--radius-md);
        border: 1px solid var(--border-strong); background: var(--surface); min-width: 0;
      }
      textarea.input { height: 80px; padding: 8px 10px; resize: vertical; }
      .help { font-size: 12px; line-height: 16px; color: var(--text-muted); }
      .error { font-size: 12px; line-height: 16px; color: var(--danger); display: flex; gap: 4px; align-items: flex-start; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .form-grid .full { grid-column: 1 / -1; }
      .check { display: flex; gap: 8px; align-items: flex-start; }
      .check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }

      /* Badges and dots */
      .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--radius-sm); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; background: var(--surface-3); color: var(--text-muted); }
      .badge.success { background: var(--success-soft); color: var(--success); }
      .badge.warning { background: var(--warning-soft); color: var(--warning); }
      .badge.danger { background: var(--danger-soft); color: var(--danger); }
      .badge.info { background: var(--info-soft); color: var(--info); }
      .badge.accent { background: var(--accent-soft); color: var(--accent-text); }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .co-SS { background: var(--entity-1); }
      .co-SMP { background: var(--entity-2); }
      .co-ASH { background: var(--entity-3); }
      .co-RCREF { background: var(--entity-4); }
      .sla-ok { background: var(--success); }
      .sla-warn { background: var(--warning); }
      .sla-breach { background: var(--danger); }
      .avatar { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-size: 11px; font-weight: 600; flex: none; }
      .kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--text-muted); }

      /* Landing */
      .landing { max-width: 1040px; margin: 0 auto; padding: 32px 24px 48px; }
      .landing-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; }
      .brand-mark { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: var(--accent-fg); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
      .notice { border: 1px solid var(--border); border-left: 3px solid var(--warning); background: var(--warning-soft); border-radius: var(--radius-lg); padding: 16px; }
      .notice p + p { margin-top: 8px; }
      .notice strong { color: var(--text); }
      .role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
      .role-card { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); cursor: pointer; min-height: 96px; }
      .role-card:hover { border-color: var(--accent); background: var(--accent-soft); }
      .role-card strong { font-weight: 600; }

      /* App shell (DESIGN.md §5) */
      .shell { display: flex; min-height: 100vh; }
      .sidebar { width: 240px; flex: none; background: var(--surface-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
      .sidebar .brand { height: 48px; padding: 0 16px; border-bottom: 1px solid var(--border); }
      .nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
      .nav-group { padding: 12px 10px 4px; font-size: 12px; line-height: 16px; color: var(--text-subtle); font-weight: 500; }
      .nav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--radius-md); color: var(--text-muted); text-decoration: none; font-weight: 500; }
      .nav a:hover { background: var(--surface-3); color: var(--text); }
      .nav a[aria-current='page'] { background: var(--accent-soft); color: var(--accent-text); }
      .nav a .tag { margin-left: auto; }
      .sidebar-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--border); }
      .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
      .topbar { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 20; }
      .topbar .company { width: 190px; height: 32px; }
      .searchbox { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; width: 300px; max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-2); color: var(--text-subtle); cursor: text; }
      .searchbox .kbd { margin-left: auto; }
      .topbar .btn.icon { width: 32px; height: 32px; }
      .proto-tag { margin-left: auto; }
      .menu-btn { display: none; }
      .content { padding: 24px; width: 100%; min-width: 0; }
      .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      .page-head p { margin-top: 2px; }
      .scrim { display: none; }

      /* Cards, tiles and grids */
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; min-width: 0; }
      .card > h3 + * { margin-top: 12px; }
      .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
      .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; min-width: 0; }
      .tile .label { font-size: 12px; line-height: 16px; color: var(--text-muted); font-weight: 500; }
      .tile .value { font-size: 22px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; overflow-wrap: anywhere; }
      .tile .foot { font-size: 12px; line-height: 16px; color: var(--text-muted); margin-top: 2px; }
      .tile.danger .value { color: var(--danger); }
      .tile.warning .value { color: var(--warning); }
      .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .cols-3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
      .cols-main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
      .bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
      .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
      .bar.warn > span { background: var(--warning); }
      .bar.ok > span { background: var(--success); }
      .list { list-style: none; margin: 0; padding: 0; }
      .list li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); min-width: 0; }
      .list li:last-child { border-bottom: 0; }
      .empty { text-align: center; padding: 24px 12px; color: var(--text-muted); }
      .empty p + .btn { margin-top: 12px; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip { height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-muted); }
      .chip[aria-pressed='true'] { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }

      /* Data grid (DESIGN.md §6) */
      .table-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); }
      table.dg { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; }
      .dg th { background: var(--surface-2); color: var(--text-muted); font-weight: 500; font-size: 12px; text-align: left; height: 32px; padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      .dg td { height: var(--row); padding: 6px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      .dg.compact td { height: var(--row-compact); padding: 4px 12px; }
      .dg tr:last-child td { border-bottom: 0; }
      .dg tbody tr.click { cursor: pointer; }
      .dg tbody tr.click:hover td { background: var(--surface-3); }
      .dg tr.selected td { background: var(--accent-soft); }
      .dg .num, .dg th.num { text-align: right; }
      .dg tfoot td { background: var(--surface-2); font-weight: 500; }

      /* Kanban (DESIGN.md §6) */
      .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(155px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
      .column { background: var(--surface-2); border-radius: var(--radius-lg); border-top: 3px solid var(--text-subtle); min-height: 320px; display: flex; flex-direction: column; scroll-snap-align: start; }
      .column.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
      .column-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-weight: 600; }
      .column-body { padding: 0 8px 8px; display: flex; flex-direction: column; gap: 8px; }
      .st-new { border-top-color: var(--stage-new); }
      .st-contacted { border-top-color: var(--stage-contacted); }
      .st-qualified { border-top-color: var(--stage-qualified); }
      .st-quoted { border-top-color: var(--stage-quoted); }
      .st-won { border-top-color: var(--stage-won); }
      .st-lost { border-top-color: var(--stage-lost); }
      .kcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; cursor: pointer; text-align: left; width: 100%; }
      .kcard:hover { border-color: var(--border-strong); }
      .kcard .name { font-weight: 600; }
      .kcard .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--text-muted); }

      /* Caller workspace */
      .queue li { cursor: pointer; padding: 8px; border-radius: var(--radius-md); border-bottom: 0; }
      .queue li:hover { background: var(--surface-3); }
      .queue li[aria-current='true'] { background: var(--accent-soft); }
      .queue li.done { opacity: 0.55; }
      .dispositions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .dispositions .btn { justify-content: flex-start; height: 36px; }
      .dispositions .btn.picked { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
      .script { background: var(--surface-2); border-radius: var(--radius-md); padding: 12px; }
      .script p + p { margin-top: 10px; }
      .script .step { font-size: 12px; line-height: 16px; color: var(--text-subtle); font-weight: 500; }
      .call-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius-md); background: var(--success-soft); color: var(--success); font-weight: 500; }

      /* Quote builder */
      .locked { display: inline-flex; align-items: center; gap: 4px; }
      .totals { width: 100%; max-width: 360px; margin-left: auto; }
      .totals div { display: flex; justify-content: space-between; padding: 4px 0; }
      .totals .grand { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; font-size: 16px; font-weight: 600; }
      .callout { display: flex; gap: 10px; padding: 12px; border-radius: var(--radius-md); background: var(--info-soft); color: var(--text); }
      .callout.warn { background: var(--warning-soft); }
      .callout.danger { background: var(--danger-soft); }
      .callout.ok { background: var(--success-soft); }
      .callout svg { margin-top: 2px; }
      .callout.warn svg { color: var(--warning); }
      .callout.danger svg { color: var(--danger); }
      .callout.ok svg { color: var(--success); }
      .callout svg { color: var(--info); }

      /* Steps */
      .steps { display: flex; gap: 4px; flex-wrap: wrap; }
      .steps span { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--surface-3); color: var(--text-muted); }
      .steps span.done { background: var(--success-soft); color: var(--success); }
      .steps span.now { background: var(--accent); color: var(--accent-fg); }

      /* Sheet, dialog, toast, popover */
      .overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
      .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-2); width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow: auto; padding: 20px; }
      .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
      .overlay.sheet { justify-content: flex-end; align-items: stretch; padding: 0; }
      .sheet-panel { background: var(--surface); border-left: 1px solid var(--border); width: 100%; max-width: 420px; height: 100%; overflow: auto; padding: 20px; box-shadow: var(--shadow-2); }
      .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: calc(100vw - 32px); }
      .toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: var(--radius-md); box-shadow: var(--shadow-1); max-width: 380px; }
      .popover { position: absolute; top: 44px; right: 8px; width: 320px; max-width: calc(100vw - 16px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); padding: 8px; z-index: 30; }
      .popover .list li { padding: 8px; }
      .offline { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface-3); color: var(--text-muted); }

      /* Phone (DESIGN.md §5: below md the sidebar becomes a sheet and tables become cards) */
      @media (max-width: 1100px) {
        .cols-3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
        .cols-3 > :first-child { grid-column: 1 / -1; }
      }
      @media (max-width: 767px) {
        body { font-size: 15px; line-height: 22px; }
        :root { --control: 44px; }
        .content { padding: 16px; }
        .landing { padding: 20px 16px 40px; }
        .sidebar { position: fixed; left: 0; top: 0; z-index: 45; transform: translateX(-100%); transition: transform 180ms ease-out; box-shadow: var(--shadow-2); }
        .shell.nav-open .sidebar { transform: none; }
        .shell.nav-open .scrim { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
        .menu-btn { display: inline-flex; }
        .topbar { padding: 0 8px; gap: 4px; }
        .topbar .company { width: auto; flex: 1 1 auto; min-width: 0; max-width: 170px; }
        .searchbox { width: 32px; padding: 0; justify-content: center; background: transparent; border-color: transparent; color: var(--text-muted); }
        .searchbox span, .searchbox .kbd { display: none; }
        .proto-tag { display: none; }
        .hide-phone { display: none !important; }
        .cols, .cols-3, .cols-main, .form-grid { grid-template-columns: minmax(0, 1fr); }
        .cols-3 > :first-child { grid-column: auto; }
        .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .table-wrap { border: 0; background: transparent; overflow: visible; }
        table.dg, .dg tbody, .dg tr, .dg td, .dg tfoot { display: block; width: 100%; }
        .dg thead { display: none; }
        .dg tr { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px 12px; margin-bottom: 8px; }
        .dg td { display: flex; justify-content: space-between; gap: 12px; height: auto; padding: 4px 0; border: 0; text-align: right; overflow-wrap: anywhere; }
        .dg td::before { content: attr(data-label); color: var(--text-muted); font-weight: 500; text-align: left; flex: none; }
        .dg td[data-label='']::before { content: none; }
        .dg td.lead { font-weight: 600; text-align: left; }
        .dg .num { text-align: right; }
        .dg tfoot tr { background: var(--surface-2); }

        const over = d.outstanding + orderTotal(o) - d.limit;

          `<div class="tiles">${tile('Present', '86 of 100')}${tile('On leave today', '3')}${tile('Not marked by 10:00', '4', '', 'warning')}${tile('Leave waiting for approval', '5')}</div>
          <div class="cols" style="margin-top:16px">
            <div class="card"><h3>On leave today</h3><ul class="list">
              <li><span class="avatar">NA</span><div class="grow">Nisha Agarwal<div class="caption muted">Tele-caller, lead converter · Agro Solar Hub</div></div>${badge('Casual leave')}</li>
              <li><span class="avatar">SK</span><div class="grow">Sanjay Kumawat<div class="caption muted">Store Manager · Shakti Supreme</div></div>${badge('Sick leave')}</li>
              <li><span class="avatar">GC</span><div class="grow">Geeta Choudhary<div class="caption muted">Accounts · Shakti Motor Pumps</div></div>${badge('Earned leave')}</li>
            </ul></div>
            <div class="card"><h3>Not marked attendance by 10:00</h3><ul class="list">
              <li><span class="avatar">DS</span><div class="grow">Deepak Saini<div class="caption muted">Tele-caller, cold calling · Shakti Supreme</div></div><button class="btn sm" data-act="toast" data-msg="Reminder sent to Deepak Saini.">Remind</button></li>
              <li><span class="avatar">MB</span><div class="grow">Mahendra Bairwa<div class="caption muted">Field Engineer · on the way to Dudu</div></div><button class="btn sm" data-act="toast" data-msg="Reminder sent to Mahendra Bairwa.">Remind</button></li>
            </ul></div>
          </div>
          <div class="card" style="margin-top:16px"><div class="card-head"><h3>Staff</h3><input class="input" style="max-width:260px" id="hr-find" data-act="hr-find" aria-label="Find a person" /></div>
            <div class="table-wrap"><table class="dg compact"><thead><tr><th>Name</th><th>Role</th><th>Company</th></tr></thead><tbody id="hr-rows">
            ${staff.map((p) => `<tr data-name="${esc(p.name.toLowerCase())}"><td class="lead" data-label="">${esc(p.name)}</td><td data-label="Role">${esc(p.role)}</td><td data-label="Company"><span class="row">${coDot(p.co)}${esc(coName(p.co))}</span></td></tr>`).join('')}
            </tbody></table></div>
            <p class="help" style="margin-top:8px">Type a name to find a person.</p>
          </div>`;
      }

      function screenApp(key) {
        return head(NAV[key].label, 'Working in the review system') +
          `<div class="card" style="max-width:640px"><div class="callout">${icon('info')}<div><div style="font-weight:500">This screen already works in the review system.</div><div>${esc(APP_SCREENS[key])}</div><div style="margin-top:8px">Sign in to the review system with the details the development team gave you to try it.</div></div></div></div>`;
      }

      function renderContent() {
        const r = role();
        const s = route().s || r.home;
        if (NAV[s] && NAV[s].app) return screenApp(s);
        if (s === 'calling') return screenCalling();
        if (s === 'board') return screenBoard();
        if (s === 'customers') return screenCustomers();
        if (s === 'customer') return screenCustomer(route().id);
        if (s === 'quote') return screenQuote();
        if (s === 'orders') return screenOrders();
        if (s === 'order') return screenOrder(route().id);
        if (s === 'credit') return screenCredit();
        const homes = {
          executive: screenExecutiveHome, general_manager: screenGmHome, sales_team_lead: screenTeamLeadHome,
          tele_caller_cc: screenCalling, tele_caller_lc: screenBoard, store_manager: screenStoreHome,
          inventory_manager: screenInventoryHome, project_manager: screenProjectHome, field_engineer: screenFieldHome,
          accounts: screenAccountsHome, hr_admin: screenHrHome,
        };
        return homes[r.key]();
      }

      function render() {
        const r = route();
        const app = document.getElementById('app');
        if (!r.role || !ROLES.find((x) => x.key === r.role)) {
          app.innerHTML = renderLanding();
          document.title = 'Shakti Prime prototype';
          return;
        }
        const scrollY = window.scrollY;
        app.innerHTML = renderShell(renderContent());
        document.title = 'Shakti Prime prototype · ' + role().name;
        window.scrollTo(0, scrollY);
      }

      /* ---------- Search ---------- */
      function openSearch() {
        openLayer(`<div class="dialog" role="dialog" aria-modal="true" aria-label="Search"><div class="field"><label for="s-q">Search by phone, name or village</label><input class="input" id="s-q" data-act="search-input" autocomplete="off" /></div><ul class="list" id="s-res" style="margin-top:8px"></ul><p class="help" id="s-help">Type at least two letters, or the last digits of a phone number.</p></div>`);
      }
      function runSearch(q) {
        const res = document.getElementById('s-res');
        const help = document.getElementById('s-help');
        q = q.trim().toLowerCase();
        if (q.length < 2) { res.innerHTML = ''; help.classList.remove('hidden'); return; }
        help.classList.add('hidden');
        const hits = [];
        ACCOUNTS.forEach((a) => { if ((a.name + ' ' + a.place + ' ' + a.phone).toLowerCase().includes(q)) hits.push([a.name, 'Customer · ' + a.place, 'customer', a.id]); });
        LEADS.forEach((l) => { if (!l.acct && (l.name + ' ' + l.place).toLowerCase().includes(q)) hits.push([l.name, 'Lead · ' + l.place, 'board', '']); });
        QUEUE.forEach((l) => { if ((l.name + ' ' + l.village + ' ' + l.phone).toLowerCase().includes(q)) hits.push([l.name, 'In the calling queue · ' + l.village, 'calling', '']); });
        res.innerHTML = hits.length ? hits.slice(0, 8).map(([n, d, s, id]) => `<li><button class="btn ghost" style="width:100%;justify-content:flex-start;height:auto;padding:6px 8px;text-align:left" data-act="goto" data-s="${s}" data-id="${id}"><span><span style="font-weight:500">${esc(n)}</span><br /><span class="caption muted">${esc(d)}</span></span></button></li>`).join('') : `<li><span class="muted">No match. Check the spelling or try the phone number.</span></li>`;
      }

      /* ---------- Events ---------- */
      document.addEventListener('click', (e) => {
        const closer = e.target.closest('[data-close]');
        if (closer && (closer === e.target || closer.tagName === 'BUTTON')) {
          const wasQualified = closer.tagName === 'BUTTON' && closer.textContent.trim() === 'Next lead';
          closeLayer();
          if (wasQualified) nextLead();
          return;
        }
        const el = e.target.closest('[data-act]');
        if (!el) {
          const pop = document.getElementById('pop');
          if (pop && !e.target.closest('.popover')) pop.innerHTML = '';
          return;
        }
        const act = el.dataset.act;
        if (['company', 'pipe', 'q-cust', 'q-co', 'q-qty', 'search-input', 'hr-find'].includes(act)) return;
        if (el.tagName === 'A' || act === 'goto') e.preventDefault();
        const pop = document.getElementById('pop');
        switch (act) {
          case 'role': pickRole(el.dataset.key); break;
          case 'change-role': location.hash = ''; break;
          case 'theme': setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); break;
          case 'open-nav': document.getElementById('shell').classList.add('nav-open'); break;
          case 'close-nav': document.getElementById('shell').classList.remove('nav-open'); break;
          case 'goto': closeLayer(); go(el.dataset.s, el.dataset.id || null); break;
          case 'search': openSearch(); break;
          case 'mic': toast('Talk to Shakti opens here. Live voice conversation arrives in Phase 2.'); break;
          case 'bell':
            pop.innerHTML = pop.innerHTML ? '' : `<div class="popover"><h3 style="padding:4px 8px">Notifications</h3><ul class="list">
              <li><span class="dot sla-breach"></span><div class="grow">Callback for Ramesh Kumar Saini is 18 hours late<div class="caption muted">10:00</div></div></li>
              <li><span class="dot sla-warn"></span><div class="grow">ASH/SO/2026-27/0142 is on hold for credit<div class="caption muted">Yesterday 16:05</div></div></li>
              <li><span class="dot sla-ok"></span><div class="grow">Bhanwar Lal Jat opened the quote on WhatsApp<div class="caption muted">09:38</div></div></li></ul></div>`;
            break;
          case 'suggest':
            pop.innerHTML = pop.innerHTML ? '' : `<div class="popover"><h3 style="padding:4px 8px">AI suggestions</h3><ul class="list">
              <li><div class="grow">Two leads from Phagi look like the same farmer. Join them?<div class="caption muted">Lead sorting · waiting for a person</div></div>${badge('Suggest', 'info')}</li>
              <li><div class="grow">Move Kisan Seva Kendra to the Dealer and Wholesale pipeline<div class="caption muted">Lead sorting · waiting for a person</div></div>${badge('Suggest', 'info')}</li></ul></div>`;
            break;
          case 'nudge': toast(`Reminder sent to ${el.dataset.name}.`); break;
          case 'toast': toast(el.dataset.msg); break;
          case 'pick-lead': stopCall(); state.cc.index = QUEUE.findIndex((q) => q.id === el.dataset.id); render(); break;
          case 'dispo': recordDisposition(Number(el.dataset.k)); break;
          case 'next-lead': nextLead(); break;
          case 'dial': startCall(); break;
          case 'end-call': stopCall(); render(); toast('Call ended. Choose how the call went.'); break;
          case 'mine': state.board.mine = el.dataset.v === '1'; render(); break;
          case 'open-lead': openLead(el.dataset.id); break;
          case 'move-lead': moveLead(el.dataset.id, document.getElementById('mv').value); break;
          case 'confirm-lost': {
            const l = LEADS.find((x) => x.id === el.dataset.id);
            l.stage = 'lost';
            closeLayer();
            render();
            toast(`${l.name} marked as lost.`);
            break;
          }
          case 'reassign': {
            const l = LEADS.find((x) => x.id === el.dataset.id);
            const to = document.getElementById('ra').value;
            if (to === 'NA') { toast('Nisha Agarwal is on leave today. Choose someone who is present.'); break; }
            l.owner = to;
            closeLayer();
            render();
            toast(`${l.name} is now with ${STAFF[to].name}.`);
            break;
          }
          case 'quote-for': state.quote = { acct: el.dataset.id, co: el.dataset.co, lines: account(el.dataset.id).type === 'Dealer' ? [['SPK50', 4]] : [['SPK75', 1]], saved: false, sent: false }; closeLayer(); go('quote'); break;
          case 'q-add': state.quote.lines.push([document.getElementById('q-add').value, 1]); state.quote.saved = false; state.quote.sent = false; render(); break;
          case 'q-remove': state.quote.lines.splice(Number(el.dataset.i), 1); state.quote.saved = false; state.quote.sent = false; render(); break;
          case 'q-save': state.quote.saved = true; render(); toast('Quote saved.'); break;
          case 'q-send': state.quote.saved = true; state.quote.sent = true; render(); toast(`Quote sent to ${callName(account(state.quote.acct).contacts[0][0])} ji on WhatsApp.`); break;
          case 'q-accept': {
            const q = state.quote;
            const a = account(q.acct);
            const no = `${q.co}/SO/2026-27/0${143 + ORDERS.filter((o) => o.date === TODAY).length}`;
            ORDERS.unshift({ no, acct: q.acct, co: q.co, date: TODAY, tier: a.type === 'Dealer' ? 'dealer' : a.type === 'Business' ? 'commercial' : 'retail', status: 'draft', lines: q.lines.map(([c, n]) => [c, n, 0]) });
            go('order', no);
            toast('Sales order made from the quote. Confirm it to start the dispatch.');
            break;
          }
          case 'ofilter': state.orderFilter = el.dataset.k; render(); break;
          case 'confirm-order': {
            const o = ORDERS.find((x) => x.no === el.dataset.no);
            const a = account(o.acct);
            const d = DEALERS.find((x) => x.name === a.name);
            if (d && (d.overdue > 0 || d.outstanding + orderTotal(o) > d.limit)) { o.status = 'hold'; render(); toast('The order is on hold for credit. An Executive can release it.'); }
            else { o.status = 'confirmed'; render(); toast('Order confirmed.'); }
            break;
          }
          case 'cancel-order':
            dialog('Cancel this order?', `<div class="field"><label for="can-r">Reason</label><select class="input" id="can-r"><option>Customer changed their mind</option><option>Ordered twice by mistake</option><option>Customer could not arrange payment</option></select></div>`,
              `<button class="btn" data-close="1">Keep the order</button><button class="btn danger" data-act="do-cancel" data-no="${esc(el.dataset.no)}">Cancel order</button>`);
            break;
          case 'do-cancel': ORDERS.find((x) => x.no === el.dataset.no).status = 'cancelled'; closeLayer(); render(); toast('Order cancelled.'); break;
          case 'release': releaseDialog(el.dataset.no); break;
          case 'do-release': {
            const reason = document.getElementById('rel-r').value.trim();
            if (!reason) { document.getElementById('rel-err').innerHTML = `<p class="error" style="margin-top:8px">${icon('alert')}Write the reason before releasing the order.</p>`; break; }
            ORDERS.find((x) => x.no === el.dataset.no).status = 'confirmed';
            closeLayer();
            render();
            toast('Order released. Your reason is kept in the activity log.');
            break;
          }
          case 'online': state.offline = false; render(); break;
          case 'checkin': state.checkedIn = true; render(); toast('Checked in at 08:52.'); break;
          case 'reached': JOBS[Number(el.dataset.i)].state = 'At site since 10:04'; render(); toast('Marked as reached. The office and the customer can see it.'); break;
          default: break;
        }
      });

      document.addEventListener('change', (e) => {
        const act = e.target.dataset.act;
        const bind = e.target.dataset.bind;
        if (act === 'company') { state.company = e.target.value; render(); }
        else if (act === 'pipe') { state.board.pipe = e.target.value; render(); }
        else if (act === 'q-cust') { state.quote.acct = e.target.value; state.quote.saved = false; state.quote.sent = false; render(); }
        else if (act === 'q-co') { state.quote.co = e.target.value; render(); }
        else if (act === 'q-qty') { const n = Math.max(1, parseInt(e.target.value, 10) || 1); state.quote.lines[Number(e.target.dataset.i)][1] = n; state.quote.saved = false; state.quote.sent = false; render(); }
        else if (bind) { ccLead()[bind] = e.target.value; }
      });
      document.addEventListener('input', (e) => {
        const act = e.target.dataset.act;
        if (act === 'search-input') runSearch(e.target.value);
        if (act === 'hr-find') {
          const q = e.target.value.trim().toLowerCase();
          document.querySelectorAll('#hr-rows tr').forEach((tr) => tr.classList.toggle('hidden', !!q && !tr.dataset.name.includes(q)));
        }
        if (e.target.dataset.bind) ccLead()[e.target.dataset.bind] = e.target.value;
      });
      document.addEventListener('focusin', (e) => {
        if (e.target.closest('[data-form="walkin"]') && !state.walkStart) state.walkStart = Date.now();
      });
      document.addEventListener('submit', (e) => {
        const form = e.target;
        if (form.dataset.form !== 'walkin') return;
        e.preventDefault();
        const f = new FormData(form);
        const phone = String(f.get('phone')).replace(/\D/g, '');
        const err = document.getElementById('walk-err');
        if (phone.length !== 10) { err.innerHTML = `<p class="error">${icon('alert')}Please check the mobile number. It should have 10 digits.</p>`; return; }
        const secs = state.walkStart ? Math.max(1, Math.round((Date.now() - state.walkStart) / 1000)) : 0;
        WALKINS.push({ time: '11:0' + Math.min(9, WALKINS.length), name: String(f.get('name')), village: String(f.get('village')), need: String(f.get('need')) + (f.get('size') ? ', ' + f.get('size') : ''), co: String(f.get('co')) });
        state.walkStart = 0;
        render();
        toast(`Walk-in saved${secs ? ' in ' + secs + (secs === 1 ? ' second' : ' seconds') : ''}. The calling team has it now.`);
      });

      /* Drag and drop on the lead board */
      document.addEventListener('dragstart', (e) => {
        const card = e.target.closest('[data-drag]');
        if (card) { e.dataTransfer.setData('text/plain', card.dataset.drag); e.dataTransfer.effectAllowed = 'move'; }
      });
      document.addEventListener('dragover', (e) => {
        const col = e.target.closest('[data-drop]');
        if (col) { e.preventDefault(); document.querySelectorAll('.column.drop').forEach((c) => c !== col && c.classList.remove('drop')); col.classList.add('drop'); }
      });
      document.addEventListener('dragleave', (e) => {
        const col = e.target.closest('[data-drop]');
        if (col && !col.contains(e.relatedTarget)) col.classList.remove('drop');
      });
      document.addEventListener('drop', (e) => {
        const col = e.target.closest('[data-drop]');
        if (!col) return;
        e.preventDefault();
        col.classList.remove('drop');
        moveLead(e.dataTransfer.getData('text/plain'), col.dataset.drop);
      });

      /* Keyboard: Ctrl K search, Escape closes, caller keys on the calling screen */
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && route().role) { e.preventDefault(); openSearch(); return; }
        if (e.key === 'Escape') { closeLayer(); const sh = document.getElementById('shell'); if (sh) sh.classList.remove('nav-open'); return; }
        const r = route();
        const onCalling = r.role && ((r.s || role().home) === 'calling');
        if (!onCalling || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.target.closest && e.target.closest('input, textarea, select')) return;
        if (document.getElementById('layer').innerHTML) {
          if (e.key === 'n' || e.key === 'N' || e.key === 'Enter') { closeLayer(); nextLead(); }
          return;
        }
        if (/^[1-8]$/.test(e.key)) { e.preventDefault(); recordDisposition(Number(e.key)); }
        else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); nextLead(); }
        else if (e.key === 'd' || e.key === 'D') { e.preventDefault(); startCall(); }
        else if (e.key === '/') { e.preventDefault(); openSearch(); }
      });

      window.addEventListener('hashchange', () => { stopCall(); closeLayer(); render(); window.scrollTo(0, 0); });
      try {
        const saved = localStorage.getItem('sp-proto-theme');
        if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
      } catch (e) { /* not available */ }
      render();
    </script>
  </body>
</html>
